syntax = "proto3";

package orisun;

option go_package = "github.com/OrisunLabs/Orisun/orisun/grpcapi";
option java_package = "com.orisun.eventstore";

import "google/protobuf/timestamp.proto";

message Position {
  int64 commit_position = 1;
  int64 prepare_position = 2;
}

message Tag {
  string key = 1;
  string value = 2;
}

message Criterion {
  repeated Tag tags = 1;
}

message Query {
  repeated Criterion criteria = 1;
}

message EventToSave {
  string event_id = 1;
  string event_type = 2;
  string data = 3;
  string metadata = 4;
}

message Event {
  string event_id = 1;
  string event_type = 2;
  string data = 3;
  string metadata = 4;
  Position position = 6;
  google.protobuf.Timestamp date_created = 7;
}

message WriteResult {
  Position log_position = 1;
}

enum Direction {
  ASC = 0;
  DESC = 1;
}

message SaveQuery{
  Position expected_position = 1;
  Query subsetQuery = 2;
}

message SaveEventsRequest {
  string boundary = 2;
  SaveQuery query = 3;
  repeated EventToSave events = 4;
}

message GetEventsRequest {
  Query query = 1;
  Position from_position = 2;
  uint32 count = 3;
  Direction direction = 4;
  string boundary = 5;
}

message GetEventsResponse {
  repeated Event events = 1;
}

message CatchUpSubscribeToEventStoreRequest {
  Position after_position = 1;
  Query query = 2;
  string subscriber_name = 3;
  string boundary = 4;
}

message PingRequest {}
message PingResponse {}

message GetServerInfoRequest {}

enum StorageBackend {
  STORAGE_BACKEND_UNSPECIFIED = 0;
  STORAGE_BACKEND_POSTGRES = 1;
  STORAGE_BACKEND_SQLITE = 2;
  STORAGE_BACKEND_FOUNDATIONDB = 3;
}

enum ServerCapability {
  SERVER_CAPABILITY_UNSPECIFIED = 0;
  SERVER_CAPABILITY_COMMAND_CONTEXT_CONSISTENCY = 1;
  SERVER_CAPABILITY_CATCH_UP_SUBSCRIPTIONS = 2;
  SERVER_CAPABILITY_INDEX_MANAGEMENT = 3;
  SERVER_CAPABILITY_BOUNDARY_CATALOG = 4;
  SERVER_CAPABILITY_GRPC_HEALTH = 5;
}

message GetServerInfoResponse {
  string version = 1;
  string git_commit = 2;
  string build_time = 3;
  StorageBackend backend = 4;
  string node_id = 5;
  repeated ServerCapability capabilities = 6;
}

// GetLatestByCriteria returns the latest event matching each criterion,
// assembled by the server from ONE consistent read snapshot, plus the
// context_position to use as SaveEvents.query.expected_position with the same
// combined criteria. Assembling the same context from independent GetEvents
// calls is not equivalent: an event can commit between the calls with a
// position below the observed maximum, and a scalar expected position cannot
// detect that.
message GetLatestByCriteriaRequest {
  string boundary = 1;
  repeated Criterion criteria = 2;
}

message LatestCriterionResult {
  Criterion criterion = 1;
  // Unset when no event matches the criterion.
  Event event = 2;
}

message GetLatestByCriteriaResponse {
  // One result per request criterion, in request order.
  repeated LatestCriterionResult results = 1;
  // Max position across the events observed in the same read snapshot;
  // the not-exists sentinel (-1, -1) when nothing matched.
  Position context_position = 2;
}

enum ValueType {
  TEXT = 0;
  NUMERIC = 1;
  BOOLEAN = 2;
  TIMESTAMPTZ = 3;
}

enum ConditionCombinator {
  AND = 0;
  OR = 1;
}

// IndexField describes one key to include in the index expression.
// Multiple fields produce a composite index.
message IndexField {
  string    json_key = 1;
  ValueType value_type = 2;
}

// IndexCondition describes one predicate in the partial-index filter.
// Multiple conditions are combined with condition_combinator.
message IndexCondition {
  string key = 1;
  string operator = 2;
  string value = 3;
}

message CreateIndexRequest {
  string                  boundary = 1;
  string                  name = 2;
  repeated IndexField     fields = 3;
  repeated IndexCondition conditions = 4;
  ConditionCombinator     condition_combinator = 5;
}

message CreateIndexResponse {}

message DropIndexRequest {
  string boundary = 1;
  string name = 2;
}

message DropIndexResponse {}

enum IndexState {
  INDEX_STATE_UNSPECIFIED = 0;
  INDEX_STATE_BUILDING = 1;
  INDEX_STATE_READY = 2;
}

message IndexDefinition {
  string                  name = 1;
  repeated IndexField     fields = 2;
  repeated IndexCondition conditions = 3;
  ConditionCombinator     condition_combinator = 4;
  IndexState              state = 5;
}

message ListIndexesRequest {
  string boundary = 1;
}

message ListIndexesResponse {
  repeated IndexDefinition indexes = 1;
}

message GetIndexRequest {
  string boundary = 1;
  string name = 2;
}

message GetIndexResponse {
  IndexDefinition index = 1;
}

service EventStore {
  rpc SaveEvents(SaveEventsRequest) returns (WriteResult) {}
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse) {}
  rpc GetLatestByCriteria(GetLatestByCriteriaRequest) returns (GetLatestByCriteriaResponse) {}
  rpc CatchUpSubscribeToEvents(CatchUpSubscribeToEventStoreRequest) returns (stream Event) {}
  rpc Ping(PingRequest) returns (PingResponse) {}
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {}
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse) {}
  rpc DropIndex(DropIndexRequest) returns (DropIndexResponse) {}
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse) {}
  rpc GetIndex(GetIndexRequest) returns (GetIndexResponse) {}
}
